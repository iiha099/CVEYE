version: 2

models:
  - name: fct_cve_daily_risk
    description: "CVE risk prioritization using KEV, EPSS, CVSS and simulated assets."
    config:
      contract:
        enforced: true
    columns:
      - name: snapshot_date
        data_type: date
        data_tests: [not_null]

      - name: cve_id
        data_type: string
        data_tests: [not_null, unique]

      - name: severity_score
        data_type: float64

      - name: epss_score
        data_type: float64

      - name: in_kev
        data_type: bool
        data_tests: [not_null]

      - name: affects_our_assets
        data_type: bool
        description: "Simulated asset exposure, not real organizational inventory."
        data_tests: [not_null]

      - name: priority_tier
        data_type: string
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['P1', 'P2', 'P3', 'P4']
