name: 'cve_intel'
version: '1.0.0'
config-version: 2

profile: 'cve_intel'

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  cve_intel:
    staging:
      +materialized: view     # cheap: just cleans the raw table
    marts:
      +materialized: table    # final tables the dashboard reads (fast queries)

seeds:
  cve_intel:
    cwe_owasp_atlas:
      +column_types:
        cwe_id: string
        cwe_name: string
        owasp_llm_id: string
        owasp_llm_name: string
        atlas_technique_id: string
        atlas_technique_name: string
